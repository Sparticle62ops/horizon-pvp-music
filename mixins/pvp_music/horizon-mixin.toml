[mod]
id = "pvp_music"
version = "1.2.0"
priority = 100

# The commit it was built and tested on.
[compatibility]
horizon_revision = "3fb4c3138e0c5d8fdd2fdb555cf31368e8897497"

[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "pvp_music"
source = "runtime.rs"

[[injection]]
id = "music"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_music"
helper = "music.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&self" },
  { name = "music", ty = "&mut Option<horizon_client::music::Music>", value = "music" },
  { name = "volume", ty = "&mut f32", value = "volume" },
]

[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]
